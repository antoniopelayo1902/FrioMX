<!DOCTYPE html>
<html lang="es" data-auth="guest">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Crear cuenta · FrioMx</title>
    <link rel="icon" href="/assets/images/icon.png" type="image/png">
    <link rel="stylesheet" href="/styles/app.css">
    <link rel="stylesheet" href="/styles/pages.css">
    <script src="/scripts/app.js"></script>
    <script src="/scripts/ui.js" defer></script>
    <script src="/scripts/register.js" defer></script>
</head>
<body>
    <header class="public-top">
        <a class="brand" href="/" aria-label="FrioMx, inicio">
            <img src="/assets/images/icon.png" alt="" width="30" height="30"><span>Frio<b>Mx</b></span>
        </a>
        <div class="actions">
            <a class="btn btn-ghost" href="/logIn">Iniciar sesión</a>
        </div>
    </header>

    <main class="auth-wrap" id="main">
        <div class="card auth-card">
            <h1>Crear cuenta</h1>
            <p class="sub">Te regalamos <strong>1,000 fichas</strong> para empezar. Sin dinero real.</p>
            <form id="register-form" novalidate>
                <div class="form-error" role="alert"></div>
                <div class="field-row">
                    <div class="field">
                        <label for="name">Nombre</label>
                        <input class="input" id="name" name="name" type="text" autocomplete="nickname" maxlength="40"
                            placeholder="¿Cómo te llamamos?" aria-describedby="name-err" autofocus>
                        <div class="error" id="name-err" aria-live="polite"></div>
                    </div>
                    <div class="field">
                        <label for="age">Edad</label>
                        <input class="input" id="age" name="age" type="text" inputmode="numeric" maxlength="4"
                            placeholder="18+" aria-describedby="age-err">
                        <div class="error" id="age-err" aria-live="polite"></div>
                    </div>
                </div>
                <div class="field">
                    <label for="email">Correo</label>
                    <input class="input" id="email" name="email" type="email" autocomplete="email" inputmode="email"
                        placeholder="nombre@correo.com" aria-describedby="email-err">
                    <div class="error" id="email-err" aria-live="polite"></div>
                </div>
                <div class="field">
                    <label for="password">Contraseña</label>
                    <div class="pw-wrap">
                        <input class="input" id="password" name="password" type="password" autocomplete="new-password"
                            aria-describedby="password-hint password-err">
                    </div>
                    <div class="hint" id="password-hint">Mínimo 8 caracteres.</div>
                    <div class="error" id="password-err" aria-live="polite"></div>
                </div>
                <div class="field">
                    <label for="confirm">Confirmar contraseña</label>
                    <div class="pw-wrap">
                        <input class="input" id="confirm" name="confirm" type="password" autocomplete="new-password"
                            aria-describedby="confirm-err">
                    </div>
                    <div class="error" id="confirm-err" aria-live="polite"></div>
                </div>
                <button class="btn btn-primary btn-lg btn-block" type="submit" id="submit">Crear cuenta</button>
            </form>
            <p class="switch">¿Ya tienes cuenta? <a href="/logIn">Inicia sesión</a></p>
        </div>
    </main>
</body>
</html>
