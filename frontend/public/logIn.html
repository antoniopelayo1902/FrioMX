<!DOCTYPE html>
<html lang="es" data-auth="guest">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Iniciar sesión · FrioMx</title>
    <link rel="icon" href="/assets/images/icon.png" type="image/png">
    <link rel="stylesheet" href="/styles/app.css">
    <link rel="stylesheet" href="/styles/pages.css">
    <script src="/scripts/app.js"></script>
    <script src="/scripts/ui.js" defer></script>
    <script src="/scripts/login.js" defer></script>
</head>
<body>
    <header class="public-top">
        <a class="brand" href="/" aria-label="FrioMx, inicio">
            <img src="/assets/images/icon.png" alt="" width="30" height="30"><span>Frio<b>Mx</b></span>
        </a>
        <div class="actions">
            <a class="btn btn-ghost" href="/register">Crear cuenta</a>
        </div>
    </header>

    <main class="auth-wrap" id="main">
        <div class="card auth-card">
            <h1>Iniciar sesión</h1>
            <p class="sub">Qué bueno verte de nuevo. Tus fichas te esperan.</p>
            <div class="form-info" id="flash" role="status"></div>
            <form id="login-form" novalidate>
                <div class="form-error" role="alert"></div>
                <div class="field">
                    <label for="email">Correo</label>
                    <input class="input" id="email" name="email" type="email" autocomplete="email" inputmode="email"
                        placeholder="nombre@correo.com" aria-describedby="email-err" autofocus>
                    <div class="error" id="email-err" aria-live="polite"></div>
                </div>
                <div class="field">
                    <label for="password">Contraseña</label>
                    <div class="pw-wrap">
                        <input class="input" id="password" name="password" type="password" autocomplete="current-password"
                            aria-describedby="password-err">
                    </div>
                    <div class="error" id="password-err" aria-live="polite"></div>
                </div>
                <button class="btn btn-primary btn-lg btn-block" type="submit" id="submit">Entrar</button>
            </form>
            <p class="switch">¿No tienes cuenta? <a href="/register">Regístrate gratis</a></p>
        </div>
    </main>
</body>
</html>
