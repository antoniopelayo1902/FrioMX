<!DOCTYPE html>
<html lang="es" data-auth="private" data-page="activity">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Historial · FrioMx</title>
    <link rel="icon" href="/assets/images/icon.png" type="image/png">
    <link rel="stylesheet" href="/styles/app.css">
    <link rel="stylesheet" href="/styles/pages.css">
    <script src="/scripts/app.js"></script>
    <script src="/scripts/ui.js" defer></script>
    <script src="/scripts/activity.js" defer></script>
</head>
<body data-shell>
    <main id="main">
        <div class="page-head">
            <div>
                <h1>Historial</h1>
                <p>Tus partidas, de la más reciente a la más antigua.</p>
            </div>
            <div class="filters" role="group" aria-label="Filtrar por juego">
                <button class="chip-btn" type="button" data-filter="" aria-pressed="true">Todos</button>
                <button class="chip-btn" type="button" data-filter="Ruleta" aria-pressed="false">Ruleta</button>
                <button class="chip-btn" type="button" data-filter="Hi-Lo" aria-pressed="false">Hi-Lo</button>
                <button class="chip-btn" type="button" data-filter="Minas" aria-pressed="false">Minas</button>
            </div>
        </div>

        <section class="card activity-card" aria-labelledby="hist-title">
            <h2 id="hist-title" class="sr-only">Partidas</h2>
            <div class="hist-summary" id="summary" aria-live="polite" hidden></div>
            <table class="table activity-table" id="table" hidden>
                <thead>
                    <tr>
                        <th scope="col">Juego</th>
                        <th scope="col">Fecha</th>
                        <th scope="col" class="right">Apuesta</th>
                        <th scope="col">Resultado</th>
                        <th scope="col" class="right">Neto</th>
                    </tr>
                </thead>
                <tbody id="rows"></tbody>
            </table>
            <div id="status" aria-live="polite"><p class="empty">Cargando partidas…</p></div>
            <div class="list-foot">
                <button class="btn" type="button" id="more" hidden>Ver más</button>
            </div>
        </section>
    </main>
</body>
</html>
